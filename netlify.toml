[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Proxy requests starting with /api/ to Netlify functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Old links: /KLEF-ACM-SC/* -> /*
[[redirects]]
  from = "/KLEF-ACM-SC/*"
  to = "/:splat"
  status = 301

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
